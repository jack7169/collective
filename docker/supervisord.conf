[supervisord]
nodaemon=true
user=root
logfile=/config/logs/supervisord.log
logfile_maxbytes=10MB
logfile_backups=3
pidfile=/var/run/supervisord.pid

[program:fastapi]
command=uvicorn app.main:app --host 0.0.0.0 --port 8080 --workers 1
directory=/app/backend
autostart=true
autorestart=true
stdout_logfile=/config/logs/fastapi.log
stdout_logfile_maxbytes=10MB
stderr_logfile=/config/logs/fastapi_error.log
stderr_logfile_maxbytes=10MB
environment=PYTHONPATH="/app/backend"

[program:huey]
command=huey_consumer app.tasks.worker.huey -w 1 -k thread -C
directory=/app/backend
autostart=true
autorestart=true
stdout_logfile=/config/logs/huey.log
stdout_logfile_maxbytes=10MB
stderr_logfile=/config/logs/huey_error.log
stderr_logfile_maxbytes=10MB
environment=PYTHONPATH="/app/backend"

[program:scheduler]
command=python -m app.tasks.scheduler
directory=/app/backend
autostart=true
autorestart=true
stdout_logfile=/config/logs/scheduler.log
stdout_logfile_maxbytes=5MB
stderr_logfile=/config/logs/scheduler_error.log
stderr_logfile_maxbytes=5MB
environment=PYTHONPATH="/app/backend"
